<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Overhead</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="What's flying overhead right now, from free ADS-B data.">
<meta name="theme-color" content="#1b2a52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Overhead">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
/* Layout: one glass card on a sky that follows the sun; faint flight tabs above; details slide up from the bottom.
   Single deliberate look (sky + white type), so colours are set explicitly rather than following light/dark. */
:root{
  --ink:#ffffff; --ink-2:rgba(255,255,255,.78); --ink-3:rgba(255,255,255,.55);
  --glass:rgba(255,255,255,.14); --glass-line:rgba(255,255,255,.22); --glass-strong:rgba(255,255,255,.22);
  --climb:#5fe0a6; --cruise:#8fd0ff; --descend:#ffbe6b; --ground:#c9d3de; --alert:#ff7a70;
  --sheet:#14203b;
  --sky-day:linear-gradient(165deg,#2f6fc4 0%,#4f93dc 45%,#8cc2ef 100%);
  --sky-dusk:linear-gradient(165deg,#2b3a78 0%,#7b5592 45%,#e08a6c 85%,#f2b277 100%);
  --sky-night:linear-gradient(165deg,#070e24 0%,#14224a 55%,#24386a 100%);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --f-num:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI Variable Display","Segoe UI",Roboto,sans-serif;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;min-height:100%;color:var(--ink);font:400 16px/1.35 var(--f-ui);background:#14224a var(--sky-night) fixed;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body[data-sky="day"]{background:#4f93dc var(--sky-day) fixed}
body[data-sky="dusk"]{background:#7b5592 var(--sky-dusk) fixed}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:3px}

.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:12px;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:14px 22px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top .loc{font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.top .loc svg{width:12px;height:12px;fill:currentColor}
.gear{width:34px;height:34px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;opacity:.55}
.gear:hover{opacity:.9}
.gear svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:1.8}

/* subtle tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gutter-l)) 0 calc(-1 * var(--gutter-r));padding:0 var(--gutter-r) 2px var(--gutter-l)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:var(--ink-3);font-size:.82rem;font-weight:600;padding:6px 10px 7px;border-radius:999px;display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.tab span{font-weight:400;font-size:.72rem;opacity:.8}
.tab:hover{color:var(--ink-2)}
.tab.on{color:var(--ink);background:rgba(255,255,255,.12)}


/* sky layers */
#sky{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;--stars:0}
.app,.scrim,.sheet{position:relative;z-index:1}
.scrim,.sheet{position:fixed}
.scrim{z-index:19}.sheet{z-index:20}
.stars{position:absolute;inset:0;opacity:var(--stars);transition:opacity 2s}
.stars i{position:absolute;border-radius:50%;background:#fff;animation:twinkle 6s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(1)}50%{transform:scale(.55);filter:brightness(.6)}}
.sun{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;
  background:radial-gradient(circle,#fffbe8 0 18%,rgba(255,236,170,.85) 26%,rgba(255,214,120,.35) 45%,rgba(255,200,100,0) 70%);transition:opacity 2s}
body[data-sky="dusk"] .sun{background:radial-gradient(circle,#fff1d6 0 16%,rgba(255,180,110,.85) 26%,rgba(255,140,90,.4) 46%,rgba(255,120,80,0) 72%);width:170px;height:170px;margin:-85px 0 0 -85px}
.moon{position:absolute;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;overflow:hidden;
  background:radial-gradient(circle at 38% 35%,#fbfbf4,#d9dccf 70%);box-shadow:0 0 28px 6px rgba(220,230,255,.28);transition:opacity 2s}
.moon .shade{position:absolute;inset:-1px;border-radius:50%;background:#0d1733;opacity:.93}
body[data-sky="day"] .moon .shade{background:#4f93dc;opacity:.9}
body[data-sky="dusk"] .moon .shade{background:#5a4a86;opacity:.9}
.glow{position:absolute;left:-10%;right:-10%;top:-30%;height:80%;background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.18),rgba(255,255,255,0) 60%)}
body[data-sky="night"] .glow{background:radial-gradient(ellipse at 30% 10%,rgba(90,120,200,.25),rgba(90,120,200,0) 60%)}
.horizon{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(to top,rgba(255,255,255,.28),rgba(255,255,255,0))}
body[data-sky="dusk"] .horizon{height:42%;background:linear-gradient(to top,rgba(255,170,110,.55),rgba(255,140,120,.18) 55%,rgba(255,140,120,0))}
body[data-sky="night"] .horizon{background:linear-gradient(to top,rgba(70,100,170,.35),rgba(70,100,170,0))}
.clouds{position:absolute;inset:0;opacity:.9}
body[data-sky="dusk"] .clouds{opacity:.55} body[data-sky="night"] .clouds{opacity:.14}
.clouds span{position:absolute;border-radius:50%;filter:blur(22px);background:radial-gradient(ellipse,rgba(255,255,255,.75),rgba(255,255,255,0) 68%);animation:drift linear infinite}
body[data-sky="dusk"] .clouds span{background:radial-gradient(ellipse,rgba(255,200,180,.8),rgba(255,180,170,0) 68%)}
.clouds .c1{width:520px;height:120px;top:18%;left:-30%;animation-duration:210s}
.clouds .c2{width:380px;height:90px;top:46%;left:-20%;animation-duration:260s;animation-delay:-120s}
.clouds .c3{width:640px;height:150px;top:68%;left:-40%;animation-duration:300s;animation-delay:-60s}
.clouds .c4{width:300px;height:70px;top:8%;left:-25%;animation-duration:180s;animation-delay:-150s}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(160vw)}}

/* the card */
.card{position:relative;background:var(--glass);border:1px solid var(--glass-line);border-radius:26px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:16px;-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);box-shadow:0 18px 40px rgba(5,10,30,.22);cursor:pointer;overflow:hidden}
.card:not(.empty):hover{background:rgba(255,255,255,.17)}
.head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.logo{position:relative;width:62px;height:62px;border-radius:16px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.logo img{position:absolute;inset:8%;width:84%;height:84%;object-fit:contain;background:#fff;opacity:0;transition:opacity .2s}
.logo img.ok{opacity:1}
.badge{width:100%;height:100%;display:grid;place-items:center;color:#1d2b4a}
.badge.code{font:800 1.05rem var(--f-num);letter-spacing:.04em}
.badge.ga{grid-template-rows:1fr auto;padding:8px 4px 6px;gap:2px}
.badge.ga svg{width:28px;height:28px;fill:#2d4473}
.badge.ga em{font-style:normal;font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ident{min-width:0}
.fno{margin:0;font:700 1.9rem/1.05 var(--f-num);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.airline{color:var(--ink-2);font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.where{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.where b{font:600 1.05rem var(--f-num);white-space:nowrap}
.where span{font-size:.8rem;color:var(--ink-2);display:flex;align-items:center;gap:4px}
.brg{width:12px;height:12px;fill:#fff}
.acft{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:.95rem;color:var(--ink-2);margin-top:-4px}
.tail{font:600 .8rem var(--f-num);letter-spacing:.06em;color:var(--ink);border:1px solid var(--glass-line);background:rgba(255,255,255,.08);padding:2px 8px;border-radius:6px}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0;padding:14px 0;border-block:1px solid rgba(255,255,255,.14)}
.stat{min-width:0}
.stat dt{font-size:.7rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.stat dd{margin:3px 0 0;font:600 1.45rem/1.1 var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat dd small{font-size:.8rem;font-weight:500;color:var(--ink-2)}
.ssub{font-size:.78rem;color:var(--ink-2);margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* origin → destination progress line */
.route{display:flex;flex-direction:column;gap:8px}
.ends{display:flex;justify-content:space-between;gap:12px}
.ap{min-width:0;display:flex;flex-direction:column}
.ap b{font:700 1.5rem/1 var(--f-num);letter-spacing:.03em}
.ap span{font-size:.8rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.ap.r{text-align:right;align-items:flex-end}
.bar{position:relative;height:22px;margin:0 6px}
.bar .track{position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;border-radius:3px;background:rgba(255,255,255,.22)}
.bar .fill{position:absolute;left:0;top:50%;height:4px;margin-top:-2px;border-radius:4px;background:var(--c);box-shadow:0 0 10px color-mix(in srgb,var(--c) 60%,transparent)}
.bar .pin{position:absolute;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;border:2px solid #fff;background:transparent}
.bar .pin.l{left:-6px;background:var(--c)} .bar .pin.r{right:-6px}
.bar .plane{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.35))}
.bar .plane svg{width:100%;height:100%;fill:#fff}
.bar.climb{--c:var(--climb)} .bar.cruise{--c:var(--cruise)} .bar.descend{--c:var(--descend)} .bar.ground{--c:var(--ground)}
.sub{display:flex;justify-content:space-between;gap:10px;font-size:.8rem;color:var(--ink-2);flex-wrap:wrap}
.phase{font-weight:600;display:flex;align-items:center;gap:6px}
.phase::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.phase.climb{--c:var(--climb)} .phase.cruise{--c:var(--cruise)} .phase.descend{--c:var(--descend)} .phase.ground{--c:var(--ground)}
.noroute{font-size:.9rem;color:var(--ink-2);padding:4px 0}

/* empty state */
.card.empty{cursor:default;align-items:flex-start;gap:6px;padding:26px 22px 24px;min-height:260px;justify-content:flex-end}
.card.empty .clock{font:300 3.6rem/1 var(--f-num);letter-spacing:-.01em}
.card.empty h2{margin:6px 0 0;font-size:1.3rem;font-weight:600}
.card.empty p{margin:0;color:var(--ink-2);max-width:42ch}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill{border:1px solid var(--glass-line);background:var(--glass-strong);border-radius:999px;padding:8px 14px;font-size:.9rem;font-weight:600}
.sweep{position:absolute;right:-60px;top:-60px;width:240px;height:240px;pointer-events:none}
.sweep span{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,.18);animation:ring 6s linear infinite;opacity:0}
.sweep span:nth-child(2){animation-delay:2s} .sweep span:nth-child(3){animation-delay:4s}
@keyframes ring{0%{transform:scale(.2);opacity:.9}100%{transform:scale(1);opacity:0}}

.status{font-size:.75rem;color:var(--ink-3);text-align:center;min-height:1em}
.status .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--climb);margin-right:6px;vertical-align:1px}
.status.stale .dot{background:var(--descend)} .status.err .dot{background:var(--alert)}
.hint{font-size:.75rem;color:var(--ink-3);text-align:center;margin-top:-4px}

/* details sheet */
.scrim{position:fixed;inset:0;z-index:19;background:rgba(3,8,20,.45);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-radius:22px 22px 0 0;max-height:90vh;overflow:auto;padding:0 var(--gutter-r) calc(20px + env(safe-area-inset-bottom,0px)) var(--gutter-l);transform:translateY(102%);transition:transform .28s ease}
.sheet.open{transform:none}
.sheet .inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:10px}
.grab{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);margin:0 auto}
.dtop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dtop h2{margin:0;font:700 1.7rem var(--f-num)} .dtop p{margin:2px 0 0;color:var(--ink-2)}
.close{border:0;background:rgba(255,255,255,.1);width:34px;height:34px;border-radius:50%;flex:none}
.photo{margin:0;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.06)}
.photo img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;max-width:100%}
.photo figcaption{font-size:.72rem;color:var(--ink-3);padding:6px 10px}
.photo a{color:var(--cruise)}
.droute{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-block:1px solid rgba(255,255,255,.1)}
.droute div{display:flex;flex-direction:column;min-width:0} .droute .r{text-align:right}
.droute b{font:700 1.4rem var(--f-num)} .droute span{font-size:.8rem;color:var(--ink-2)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px;margin:0}
.facts div{min-width:0}
.facts dt{font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.facts dd{margin:2px 0 0;font-size:.95rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{color:#fff;text-decoration:none;font-size:.9rem;font-weight:600;background:rgba(255,255,255,.1);padding:8px 14px;border-radius:999px}
.fine{font-size:.75rem;color:var(--ink-3);margin:0}

/* settings */
dialog{border:1px solid rgba(255,255,255,.14);border-radius:18px;background:var(--sheet);color:var(--ink);padding:0;width:min(480px, calc(100vw - 32px));max-height:88vh}
dialog::backdrop{background:rgba(3,8,20,.55)}
dialog form{display:flex;flex-direction:column;gap:14px;padding:20px}
dialog h2{margin:0;font-size:1.2rem}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.field .lbl{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.field input[type=text],.field input[type=url],.field input[type=number],.field select{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);border-radius:10px;padding:9px 10px;width:100%;color:#fff;font:inherit}
.field .note{font-size:.75rem;color:var(--ink-3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:8px;font-size:.92rem}
.actions{display:flex;justify-content:flex-end;gap:8px}
.adv{border-top:1px solid rgba(255,255,255,.12);padding-top:10px}
.adv summary{cursor:pointer;font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);list-style:none;display:flex;align-items:center;gap:6px}
.adv summary::-webkit-details-marker{display:none}
.adv summary::before{content:"›";font-size:1rem;transition:transform .15s}
.adv[open] summary::before{transform:rotate(90deg)}
.advbody{display:flex;flex-direction:column;gap:14px;padding-top:14px}
.btn{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);border-radius:999px;padding:8px 16px;font-weight:600}
.btn.primary{background:#fff;color:#14203b;border-color:#fff}

/* patio display: same card, scaled to the screen */
body.kiosk{cursor:none}
body.kiosk .app{max-width:none;min-height:100vh;justify-content:center;padding-block:2vh}
html.kiosk{font-size:clamp(16px,2.1vw,34px)}
body.kiosk .card{max-width:min(1100px,94vw);width:100%;margin:0 auto}
body.kiosk .tabs{justify-content:center}
body.kiosk .hint{display:none}
body.kiosk .gear{opacity:.2}

@media (max-width:380px){ .fno{font-size:1.6rem} .stat dd{font-size:1.2rem} .logo{width:54px;height:54px} .facts{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (prefers-reduced-motion: reduce){ .sweep span{animation:none;opacity:.3;transform:scale(.6)} .sheet,.scrim{transition:none} .stars i,.clouds span{animation:none} .clouds span{transform:translateX(45vw)} }
</style>
</head>
<body data-sky="night">
<div id="sky" aria-hidden="true">
  <div class="stars"></div>
  <div class="glow"></div>
  <div class="sun"></div>
  <div class="moon"><span class="shade"></span></div>
  <div class="clouds"><span class="c1"></span><span class="c2"></span><span class="c3"></span><span class="c4"></span></div>
  <div class="horizon"></div>
</div>
<div class="app">
  <header class="top">
    <div class="loc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg><span id="where">Overhead</span></div>
    <button class="gear" id="settingsBtn" aria-label="Settings" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Aircraft in range" hidden></nav>
  <main id="stage" aria-live="polite"></main>
  <div class="hint">Tap the card for details</div>
  <div class="status" id="status" role="status"></div>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" aria-label="Aircraft details" aria-hidden="true"><div class="inner" id="sheetInner"></div></section>

<dialog id="settings">
  <form method="dialog" id="settingsForm" novalidate>
    <h2>Settings</h2>
    <div class="field">
      <span class="lbl">Radius <span id="s-radiusVal"></span></span>
      <input type="range" id="s-radius" min="1" max="25" step="0.5" aria-label="Radius in miles">
    </div>
    <div class="field">
      <label for="s-loc">Location</label>
      <select id="s-loc"><option value="gps">Follow my location</option><option value="fixed">Fixed point (patio, receiver)</option></select>
    </div>
    <div id="f-fixedwrap">
      <div class="two" id="f-fixed">
        <div class="field"><label for="s-lat">Latitude</label><input type="number" id="s-lat" step="any" inputmode="decimal"></div>
        <div class="field"><label for="s-lon">Longitude</label><input type="number" id="s-lon" step="any" inputmode="decimal"></div>
      </div>
      <div style="margin-top:10px"><button type="button" class="btn" id="s-here">Use where I am now</button></div>
    </div>
    <div class="field">
      <label for="s-units">Units</label>
      <select id="s-units"><option value="imperial">Feet, mph, miles</option><option value="metric">Metres, km/h, km</option></select>
    </div>
    <label class="check"><input type="checkbox" id="s-ground"> Include aircraft on the ground</label>
    <details class="adv">
      <summary>Advanced</summary>
      <div class="advbody">
        <div class="field">
          <span class="lbl">Refresh every <span id="s-refreshVal"></span></span>
          <input type="range" id="s-refresh" min="5" max="60" step="1" aria-label="Refresh interval in seconds">
        </div>
        <div class="field">
          <label for="s-source">Data source</label>
          <select id="s-source">
            <option value="auto">Free networks (automatic)</option>
            <option value="adsblol">adsb.lol</option>
            <option value="adsbfi">adsb.fi</option>
            <option value="airplaneslive">airplanes.live</option>
            <option value="local">My receiver (readsb / tar1090)</option>
          </select>
        </div>
        <div class="field" id="f-relay">
          <label for="s-relay">Relay address</label>
          <input type="text" id="s-relay" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="url" placeholder="Shared relay (default)" autocomplete="off">
          <span class="note">Leave empty to use the shared relay.</span>
        </div>
        <div class="field" id="f-local">
          <label for="s-localUrl">Receiver data address</label>
          <input type="text" id="s-localUrl" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="url" placeholder="/tar1090/data/aircraft.json">
          <span class="note">For your own antenna on a Raspberry Pi.</span>
        </div>
        <label class="check"><input type="checkbox" id="s-kiosk"> Patio display mode</label>
        <label class="check"><input type="checkbox" id="s-demo"> Demo traffic</label>
      </div>
    </details>
    <div class="actions"><button type="button" class="btn" id="s-cancel">Cancel</button><button type="submit" class="btn primary">Save</button></div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
