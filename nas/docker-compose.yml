# Overhead relay for Synology Container Manager (or any Docker host).
# Paste this whole file into Container Manager → Project → Create → "Create docker-compose.yml".
# The ONLY line to change is TS_AUTHKEY below.
#
# What runs:
#   tailscale – gives the relay a private-to-public HTTPS address via Tailscale Funnel.
#               No router ports are opened; nothing listens on your home network.
#   relay     – ~150 lines of Node (nas/server.mjs) that forwards only to a few flight-data sites.
#               It runs inside Tailscale's network space on 127.0.0.1, so even devices on your
#               own Wi-Fi can't reach it directly.
#
# Hardening: both containers drop every Linux capability and can't gain new privileges; the relay
# runs as an unprivileged user on a read-only filesystem with small memory/process limits, and its
# code is downloaded from a fixed commit and checked against a SHA-256 checksum before it runs.

services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: overhead-tailscale
    hostname: overhead-relay
    environment:
      TS_AUTHKEY: "PASTE-YOUR-TAILSCALE-AUTH-KEY-HERE"
      TS_HOSTNAME: overhead-relay
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /tmp/serve.json
    # Write the Funnel config (public HTTPS on 443 → relay on 127.0.0.1:8787), then start Tailscale.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '%s' '{"TCP":{"443":{"HTTPS":true}},"Web":{"$${TS_CERT_DOMAIN}:443":{"Handlers":{"/":{"Proxy":"http://127.0.0.1:8787"}}}},"AllowFunnel":{"$${TS_CERT_DOMAIN}:443":true}}' > /tmp/serve.json
        exec /usr/local/bin/containerboot
    volumes:
      - tailscale-state:/var/lib/tailscale
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    restart: unless-stopped

  relay:
    image: node:22-alpine
    container_name: overhead-relay
    network_mode: service:tailscale
    depends_on: [tailscale]
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      HOST: 127.0.0.1
      PORT: "8787"
      ALLOWED_ORIGINS: https://proostusn.github.io,https://spotair.roosfamily.com
      FLYITALY_KEY: ""   # optional: paste a free FlyItalyADSB key between the quotes
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        wget -qO /tmp/server.mjs https://raw.githubusercontent.com/proostUSN/overhead/24831840ba5727278ae4ed462865c5fc41c63af0/nas/server.mjs
        echo "715d6ea7326eb34b0f6cec93b0cca75525c85db7d4d1f59f6f780dd5b40bd6fd  /tmp/server.mjs" | sha256sum -c -
        exec node /tmp/server.mjs
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
    restart: unless-stopped

volumes:
  tailscale-state:
